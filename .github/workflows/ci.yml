name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: plugins/ua-memory

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/ua-memory/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed so the plugin runs from a clone with no build step.
      - run: npm run build
      - run: git diff --exit-code dist/
